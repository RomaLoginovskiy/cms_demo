# Full local environment on floci (spec/components/floci-local-environment.md): nightly, on demand,
# and on pull requests labelled "e2e". Uses the same make targets as a laptop.
name: e2e-floci

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      PROFILE: ci
      FLOCI_IAM_ENFORCEMENT: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (standard runners have about 14 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Bring up floci, Terraform and Argo CD
        run: make local-all PROFILE=ci
      - name: Fitness functions F1-F5
        run: make local-verify
      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=infra/local/.kubeconfig
          kubectl get nodes -o wide || true
          kubectl get applications -n argocd || true
          kubectl get pods -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          docker compose -f infra/local/docker-compose.yml logs --tail 300 floci || true
      - name: Teardown (F6)
        if: always()
        run: make local-nuke
