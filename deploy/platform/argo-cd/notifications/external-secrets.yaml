# Coralogix ops-events key for Argo CD Notifications (ADR-025). Store argocd-secrets is usable only from
# namespace argocd, and its role reads only cms-demo/<env>/coralogix-ops-events (never the ingest key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: argocd-secrets
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: coralogix-ops-events-token
      remoteRef:
        key: coralogix-ops-events
        property: API_KEY
    # Region of the key's team: the webhook URL is https://api.$coralogix-domain/v1/ops-events.
    - secretKey: coralogix-domain
      remoteRef:
        key: coralogix-ops-events
        property: DOMAIN
