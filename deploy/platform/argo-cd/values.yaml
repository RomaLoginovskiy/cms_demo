            {{- $commit := dict -}}
            {{- if $rev }}{{ $commit = call .repo.GetCommitMetadata $rev }}{{ end -}}
            {
              "opsEvent": {
                "timestamp": {{ $op.finishedAt | default (dateInZone "2006-01-02T15:04:05Z" now "UTC") | toJson }},
                "description": {{ printf "%s %s %s to %s" $service ($tag | default "(unknown tag)") $outcome .context.environment | toJson }},
                "attributes": {
                  "service": {"name": {{ $service | toJson }}},
                  "environment": {{ .context.environment | toJson }},
                  "additional": {
                    "category": "deployment",
                    "origin": "argocd",
                    "argocdApp": {{ .app.metadata.name | toJson }},
                    "syncPhase": {{ $phase | toJson }},
                    "health": {{ $health | toJson }},
                    "imageTag": {{ $tag | toJson }},
                    "vcsRepository": {{ $repoHTTPS | toJson }},
                    "vcsRef": {{ .app.spec.source.targetRevision | toJson }},
                    "vcsRevision": {{ $rev | toJson }},
                    "commitAuthor": {{ $commit.Author | default "" | toJson }},
                    "commitSubject": {{ $commit.Message | default "" | splitList "\n" | first | trunc 200 | toJson }},
                    "sourceRevision": {{ $src | toJson }},
                    "sourceCommitUrl": {{ if $src }}{{ printf "%s/commit/%s" .context.sourceRepoUrl $src | toJson }}{{ else }}""{{ end }}
                  }
                },
                "cdEvent": {
                  "system": "CD_SYSTEM_ARGOCD",
                  "pipeline": {
                    "name": {{ .app.metadata.name | toJson }},
                    "run": {"id": {{ $rev | toJson }}, "url": {{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }}},
                    "result": {"status": "{{ $status }}"},
                    "task": {"name": "sync", "type": "PIPELINE_TASK_TYPE_DEPLOY"}
                  },
                  "vcs": {
                    "system": "VCS_SYSTEM_GITHUB",
                    "type": "VCS_REF_TYPE_BRANCH",
                    "repository": {"name": {{ call .repo.FullNameByRepoURL $repo | toJson }}, "url": {{ $repoHTTPS | toJson }}},
                    "ref": {"head": {"name": {{ .app.spec.source.targetRevision | toJson }}, "revision": {{ $rev | toJson }}}}
                  }
                }
              }
            }
    template.coralogix-config-change: |
      webhook:
        coralogix-ops-events:
          method: POST
          body: |
            {{- $op := .app.status.operationState -}}
            {{- $phase := $op.phase | default "" -}}
            {{- $sources := list -}}
            {{- with .app.spec.source }}{{ $sources = list . }}{{ end -}}
            {{- with .app.spec.sources }}{{ $sources = . }}{{ end -}}
            {{- $revs := list -}}
            {{- with $op.syncResult }}{{ with .revision }}{{ $revs = list . }}{{ end }}{{ with .revisions }}{{ $revs = . }}{{ end }}{{ end -}}
            {{- if not $revs }}{{ with $op.operation }}{{ with .sync }}{{ with .revision }}{{ $revs = list . }}{{ end }}{{ with .revisions }}{{ $revs = . }}{{ end }}{{ end }}{{ end }}{{ end -}}
            {{- $gitRepo := "" }}{{ $gitRef := "" }}{{ $gitRev := "" }}{{ $parts := list -}}
            {{- range $i, $s := $sources -}}
              {{- $r := "" }}{{ if lt $i (len $revs) }}{{ $r = index $revs $i }}{{ end -}}
              {{- if $s.chart -}}
                {{- $parts = append $parts (printf "%s@%s" $s.chart $s.targetRevision) -}}
              {{- else -}}
                {{- if not $gitRepo }}{{ $gitRepo = $s.repoURL }}{{ $gitRef = $s.targetRevision }}{{ $gitRev = $r }}{{ end -}}
                {{- with $s.path }}{{ $parts = append $parts . }}{{ end -}}
              {{- end -}}
            {{- end -}}
            {{- $repoHTTPS := "" }}{{ if $gitRepo }}{{ $repoHTTPS = call .repo.RepoURLToHTTPS $gitRepo | trimSuffix ".git" }}{{ end -}}
            {{- $commit := dict -}}
            {{- if and .app.spec.source $gitRev }}{{ $commit = call .repo.GetCommitMetadata $gitRev }}{{ end -}}
            {{- $outcome := "synced" }}{{ if ne $phase "Succeeded" }}{{ $outcome = printf "sync %s" (lower $phase) }}{{ end -}}
            {
              "opsEvent": {
                "timestamp": {{ $op.finishedAt | default (dateInZone "2006-01-02T15:04:05Z" now "UTC") | toJson }},
                "description": {{ printf "%s config %s at %s" .app.metadata.name $outcome (trunc 7 $gitRev | default "unknown revision") | toJson }},
                "attributes": {
                  "environment": {{ .context.environment | toJson }},
                  "additional": {
                    "category": "platform-config",
                    "origin": "argocd",
                    "argocdApp": {{ .app.metadata.name | toJson }},
                    "argocdProject": {{ .app.spec.project | toJson }},
                    "argocdUrl": {{ printf "%s/applications/%s" .context.argocdUrl .app.metadata.name | toJson }},
                    "syncPhase": {{ $phase | toJson }},
                    "health": {{ .app.status.health.status | default "" | toJson }},
                    "sources": {{ join ", " $parts | toJson }},
                    "vcsRepository": {{ $repoHTTPS | toJson }},
                    "vcsRef": {{ $gitRef | toJson }},
                    "vcsRevision": {{ $gitRev | toJson }},
                    "commitUrl": {{ if and $repoHTTPS $gitRev }}{{ printf "%s/commit/%s" $repoHTTPS $gitRev | toJson }}{{ else }}""{{ end }},
                    "commitAuthor": {{ $commit.Author | default "" | toJson }},
                    "commitSubject": {{ $commit.Message | default "" | splitList "\n" | first | trunc 200 | toJson }}
                  }
                },
                "customEvent": {}
              }
            }

controller:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

redis:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
