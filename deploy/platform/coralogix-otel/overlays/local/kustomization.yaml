apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ../../base
  # Emulated AWS CloudWatch metrics (floci has none); spec: workshop-telemetry-detection.md.
  - aws-signal-emulator/resources.yaml
configMapGenerator:
  - name: aws-signal-emulator
    files:
      - emulator.py=aws-signal-emulator/emulator.py
helmCharts:
  - name: otel-integration
    repo: https://cgx.jfrog.io/artifactory/coralogix-charts-virtual
    version: 0.0.371
    releaseName: otel-coralogix-integration
    namespace: observability
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml
patches:
  # Replaces coralogix/post-renderer.sh: k3s inside Docker has no shared root mount, so
  # HostToContainer propagation fails; None still bind-mounts the (readable) host paths.
  - path: mount-propagation.yaml
