apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The otel-integration chart itself is inflated in each overlay (helmCharts) so overlays can add
# environment values; everything here is plain YAML shared by all environments.
namespace: observability
resources:
  - external-secrets.yaml
  - otel-agent-service.yaml
  - traces-route.yaml
