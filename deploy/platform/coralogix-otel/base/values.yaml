# Coralogix otel-integration values (from coralogix/values.yaml, ADR-016). Environment specifics
# (clusterName, local-only switches) live in overlays/<env>/values.yaml.
global:
  # The team's region comes with its key: secret coralogix-keys (ESO, cms-demo/<env>/coralogix-ingest,
  # properties PRIVATE_KEY and DOMAIN, written by `make local-secrets` from CX_DOMAIN). The chart puts
  # the domain only into collector config (exporters, OpAMP), where the collector expands the env var.
  domain: "${env:CORALOGIX_DOMAIN}"
  clusterName: set-per-environment

opentelemetry-cluster-collector:
  replicaCount: 1
  # Replaces the chart's list (Helm does not merge lists): its key, plus the region.
  extraEnvs: &coralogix-envs
    - name: CORALOGIX_PRIVATE_KEY
      valueFrom:
        secretKeyRef:
          name: coralogix-keys
          key: PRIVATE_KEY
    - name: CORALOGIX_DOMAIN
      valueFrom:
        secretKeyRef:
          name: coralogix-keys
          key: DOMAIN
  # Env vars from Secrets are read only at start, so Reloader restarts the pods when the key changes.
  annotations:
    secret.reloader.stakater.com/reload: coralogix-keys
  presets:
    reduceResourceAttributes:
      enabled: true
    kubernetesResources:
      enabled: true
      periodicCollection:
        enabled: true
      dropManagedFields:
        enabled: true
    logsCollection:
      enabled: true
      storeCheckpoints: false
    resourceDetection:
      enabled: true
    hostMetrics:
      enabled: true
      process:
        enabled: true
    transactions:
      enabled: true
    hostEntityEvents:
      enabled: true
    clusterMetrics:
      enabled: true
  config:
    receivers:
      # kube-state-metrics (deploy/platform/kube-state-metrics): kube_pod_info / kube_node_info for
      # APM-to-infrastructure correlation, as the chart's values-cluster-ksm.yaml does.
      prometheus/ksm:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 30s
              static_configs:
                - targets: [kube-state-metrics.observability.svc.cluster.local:8080]
      # node-exporter (deploy/platform/node-exporter, hostNetwork): one target per node at <node IP>:9100.
      # Host-level families only, to keep series per node bounded.
      prometheus/node-exporter:
        config:
          scrape_configs:
            - job_name: node-exporter
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [observability]
                  selectors:
                    - role: pod
                      label: app.kubernetes.io/name=prometheus-node-exporter
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  regex: "9100"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: node_(cpu_seconds_total|load1|load5|load15|memory_.+|filesystem_(size|avail|free)_bytes|network_(receive|transmit)_(bytes|errs|drop)_total|disk_(read|written)_bytes_total|uname_info|boot_time_seconds)
                  action: keep
    processors:
      # The Prometheus receiver moves the target's instance label into service.instance.id; Coralogix
      # APM matches node_* series on instance (internal IP:9100), so put it back on the data points.
      # Coralogix appends _total to counters, so strip the Prometheus one (as transform/prometheus does
      # for the collector's own metrics); otherwise node_cpu_seconds_total lands as ..._total_total.
      transform/node-exporter-instance:
        error_mode: ignore
        metric_statements:
          - context: metric
            statements:
              - replace_pattern(metric.name, "_total$", "") where resource.attributes["service.name"] == "node-exporter"
          - context: datapoint
            statements:
              - set(datapoint.attributes["instance"], resource.attributes["service.instance.id"]) where resource.attributes["service.name"] == "node-exporter"
    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster, prometheus, prometheus/k8s_apiserver_metrics, prometheus/ksm, prometheus/node-exporter, otlp]
          processors: [memory_limiter, transform/node-exporter-instance]

opentelemetry-agent:
  extraEnvs: *coralogix-envs
  # Chart default. Apps export to status.hostIP:4318; through a hostPort the portmap CNI masquerades
  # every same-node pod, so k8sattributes (pod_association from: connection) sees the bridge IP and
  # spans and spanmetrics lose k8s.pod.name / k8s.node.name, which APM-to-infrastructure correlation needs.
  hostNetwork: true
  # Env vars from Secrets are read only at start, so Reloader restarts the pods when the key changes.
  annotations:
    secret.reloader.stakater.com/reload: coralogix-keys
  # Container logs, metrics, traces and profiles all go straight from the agent to Coralogix
  # (the chart's default exporters); there is no Kafka hop for logs (Q7, decided 2026-11-02).
  presets:
    profilesCollection:
      enabled: true
    spanMetrics:
      # ADR-024 item 1: bounds above 200 ms, so p95 is not capped during incidents (the P1 alert uses 150 ms).
      histogramBuckets: [5ms, 10ms, 25ms, 50ms, 100ms, 150ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s]
      dbMetrics:
        enabled: true
    logsCollection:
      enabled: true
      reduceLogAttributes:
        enabled: true
      storeCheckpoints: false
    hostMetrics:
      enabled: true
      process:
        enabled: true
    hostEntityEvents:
      enabled: true
    # Off by choice: Kubernetes attributes come from k8sattributes.
    resourceDetection:
      enabled: false
    reduceResourceAttributes:
      enabled: true
    kubernetesExtraMetrics:
      enabled: true
      perNode: true
      scrapeAll: false
  command:
    extraArgs: ["--feature-gates=service.profilesSupport"]
  config:
    connectors:
      spanmetrics/db2:
        aggregation_cardinality_limit: 100000
        dimensions:
          - name: db.namespace
          - name: db.operation.name
          - name: db.collection.name
          - name: db.system
          - name: service.version
        histogram:
          explicit:
            buckets: [50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        metrics_expiration: 5m
    processors:
      resource/remove-fields:
        attributes:
          - action: delete
            key: container.image.name
          - action: delete
            key: container_image_name

# Chart 0.0.371 still bundles the legacy coralogix-ebpf-profiler (image 0.0.15), whose OTLP profiles
# proto predates the 0.164 collectors ("proto: wrong wireType = 2 for field LinkIndex"). The chart's
# supported profiler is the otelcol-ebpf-profiler distribution; its chart defaults already export
# profiles to the node-local agent, whose profilesCollection/profilesK8sAttributes presets forward them.
coralogix-ebpf-profiler:
  enabled: false

opentelemetry-ebpf-profiler:
  enabled: true
  extraEnvs: *coralogix-envs

opentelemetry-gateway:
  extraEnvs: *coralogix-envs
  presets:
    reduceResourceAttributes:
      enabled: true
