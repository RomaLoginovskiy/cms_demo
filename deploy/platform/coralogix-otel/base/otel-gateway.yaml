# App-layer gateway (ex k8s/otel-gateway-*.yaml): consumes container logs from Kafka topic otel-logs
# and forwards OTLP traces to Coralogix.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  labels:
    app: otel-gateway
    component: telemetry
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      kafka:
        brokers: ${env:KAFKA_BROKERS}
        group_id: otel-gateway-logs
        logs:
          topics:
            - otel-logs
          encoding: otlp_json
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
    exporters:
      coralogix:
        domain: eu1.coralogix.com
        private_key: ${env:CORALOGIX_PRIVATE_KEY}
        application_name: otel
        subsystem_name: gateway
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [kafka]
          processors: [memory_limiter, batch]
          exporters: [coralogix]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [coralogix]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  labels:
    app: otel-gateway
    component: telemetry
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-gateway
  template:
    metadata:
      labels:
        app: otel-gateway
        component: telemetry
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-gateway
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          env:
            - name: CORALOGIX_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: coralogix-keys
                  key: PRIVATE_KEY
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: kafka-bootstrap
                  key: KAFKA_BROKERS
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  labels:
    app: otel-gateway
    component: telemetry
spec:
  type: ClusterIP
  selector:
    app: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health
      port: 13133
      targetPort: 13133
