apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coralogix-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: observability-secrets
  target:
    name: coralogix-keys
    creationPolicy: Owner
  data:
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: coralogix-ingest
        property: PRIVATE_KEY
---
# Collectors expand ${env:KAFKA_BROKERS} as YAML, so the comma-separated SSM value becomes a flow list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: observability-parameters
  target:
    name: kafka-bootstrap
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KAFKA_BROKERS: "[{{ .brokers }}]"
  data:
    - secretKey: brokers
      remoteRef:
        key: kafka/bootstrap_brokers
