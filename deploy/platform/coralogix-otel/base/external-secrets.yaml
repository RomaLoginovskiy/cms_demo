apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coralogix-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: observability-secrets
  target:
    name: coralogix-keys
    creationPolicy: Owner
  data:
    - secretKey: PRIVATE_KEY
      remoteRef:
        key: coralogix-ingest
        property: PRIVATE_KEY
    # Region of the key's team (eu1.coralogix.com, ...): the collectors' global.domain.
    - secretKey: DOMAIN
      remoteRef:
        key: coralogix-ingest
        property: DOMAIN
