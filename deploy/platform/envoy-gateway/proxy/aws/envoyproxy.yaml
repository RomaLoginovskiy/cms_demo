# AWS: internet-facing NLB with IP targets, provisioned by AWS LBC. loadBalancerClass is set at
# creation so LBC's Service webhook never mutates the (immutable) field (envoyproxy/gateway#1793).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: cms-edge
  namespace: edge
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: cms-edge
        type: LoadBalancer
        loadBalancerClass: service.k8s.aws/nlb
        loadBalancerSourceRanges:
          - 0.0.0.0/32
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-ssl-cert: set-by-applicationset
          service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
          service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
          service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
          service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
      envoyDeployment:
        replicas: 2
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: cms-edge
        container:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
