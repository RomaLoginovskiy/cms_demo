# The NLB sends PROXY protocol v2. optional: in-cluster clients may call the Gateway Service directly.
# Envoy sees plain HTTP behind the NLB's TLS listener, so X-Forwarded-Proto reads "http"; the backends
# do not use it (no forwarded-headers middleware). Envoy Gateway 1.9 has no field to derive it from
# the PROXY destination port.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: cms-edge
  namespace: edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cms-edge
  proxyProtocol:
    optional: true
