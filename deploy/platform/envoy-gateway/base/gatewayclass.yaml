apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # The EnvoyProxy is per runtime: deploy/platform/envoy-gateway/proxy/{aws,floci}.
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: cms-edge
    namespace: edge
