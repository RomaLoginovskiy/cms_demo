# One IRSA identity per reader scope (ADR-019); ESO requests their tokens itself (JWT auth).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-app
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: set-by-applicationset
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-observability
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: set-by-applicationset
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-argocd
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: set-by-applicationset
