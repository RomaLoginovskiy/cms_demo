# Four stores: app {Secrets Manager, Parameter Store}, observability {Secrets Manager} and argocd {Secrets Manager}.
# Each is usable only from the namespace that needs it, and its prefix makes ExternalSecret keys environment-agnostic.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: app-secrets
  labels:
    cms-demo/store-service: SecretsManager
spec:
  conditions:
    - namespaces: ["cms-demo"]
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      prefix: set-by-applicationset
      auth:
        jwt:
          serviceAccountRef:
            name: eso-app
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: app-parameters
  labels:
    cms-demo/store-service: ParameterStore
spec:
  conditions:
    - namespaces: ["cms-demo"]
  provider:
    aws:
      service: ParameterStore
      region: eu-west-1
      prefix: set-by-applicationset
      auth:
        jwt:
          serviceAccountRef:
            name: eso-app
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: observability-secrets
  labels:
    cms-demo/store-service: SecretsManager
spec:
  conditions:
    - namespaces: ["observability"]
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      prefix: set-by-applicationset
      auth:
        jwt:
          serviceAccountRef:
            name: eso-observability
            namespace: external-secrets
---
# Argo CD Notifications: only the Coralogix ops-events key (ADR-025), never the ingest key.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: argocd-secrets
  labels:
    cms-demo/store-service: SecretsManager
spec:
  conditions:
    - namespaces: ["argocd"]
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      prefix: set-by-applicationset
      auth:
        jwt:
          serviceAccountRef:
            name: eso-argocd
            namespace: external-secrets
