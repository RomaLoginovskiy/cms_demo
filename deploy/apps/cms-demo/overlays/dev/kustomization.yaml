apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cms-demo
resources:
  - ../../base
  - pdbs.yaml
components:
  - ../../components/loadgen
# Rewritten by the promote-dev PR (same commit as patches/build-info.yaml).
images:
  - name: cms-backend
    newTag: sha-000000000000
  - name: media-worker
    newTag: sha-000000000000
  - name: cms-agent
    newTag: sha-000000000000
  - name: cms-frontend
    newTag: sha-000000000000
  - name: canvas-backend
    newTag: sha-000000000000
  - name: canvas-frontend
    newTag: sha-000000000000
  - name: canvas-load
    newTag: sha-000000000000
patches:
  - path: patches/environment.yaml
  - path: patches/replicas.yaml
  - path: patches/build-info.yaml
  # Load generator goes through the public hostname (NAT EIPs are in the NLB allowlist).
  - path: patches/loadgen-config.yaml
  # Q3: same value as public_hostname in infra/terraform/envs/dev/infra.tfvars.
  - target:
      kind: HTTPRoute
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["cms-dev.replace-with-domain.invalid"]
