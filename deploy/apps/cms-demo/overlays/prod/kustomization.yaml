apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cms-demo
# Phase 4. No load generator in prod.
resources:
  - ../../base
  - pdbs.yaml
# Promoted by a reviewed PR copying the tag set from overlays/dev.
images:
  - name: cms-backend
    newTag: sha-000000000000
  - name: media-worker
    newTag: sha-000000000000
  - name: cms-agent
    newTag: sha-000000000000
  - name: cms-frontend
    newTag: sha-000000000000
  - name: canvas-backend
    newTag: sha-000000000000
  - name: canvas-frontend
    newTag: sha-000000000000
  - name: canvas-load
    newTag: sha-000000000000
patches:
  - path: patches/environment.yaml
  - path: patches/replicas.yaml
  - path: patches/build-info.yaml
  - target:
      kind: HTTPRoute
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["cms.replace-with-domain.invalid"]
