apiVersion: apps/v1
kind: Deployment
metadata:
  name: canvas-backend
  labels:
    app: canvas-backend
    component: api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # SignalR presence is in memory and SQLite is on a ReadWriteOnce volume: one replica, no surge.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: canvas-backend
  template:
    metadata:
      labels:
        app: canvas-backend
        component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canvas-backend
          image: canvas-backend
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__Sqlite
              value: "Data Source=/app/data/whiteboard.db"
            # AllowCredentials requires the exact browser origin.
            - name: Cors__Origin
              valueFrom:
                secretKeyRef:
                  name: app-endpoints
                  key: PUBLIC_ORIGIN
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OpenTelemetry__OtlpEndpoint
              value: "http://$(NODE):4318"
            # deployment.environment.name: APM environment, matched by Coralogix annotations (ADR-025).
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: build-info
                  key: DEPLOYMENT_ENVIRONMENT
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=$(DEPLOYMENT_ENVIRONMENT)"
            - name: OpenTelemetry__ServiceName
              value: "demo-canvas-api"
            - name: RUM_DEMO_ENABLED
              value: "false"
          volumeMounts:
            - name: canvas-backend-data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: canvas-backend-data
          persistentVolumeClaim:
            claimName: canvas-backend-data-pvc
