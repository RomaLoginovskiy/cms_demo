apiVersion: apps/v1
kind: Deployment
metadata:
  name: canvas-frontend
  labels:
    app: canvas-frontend
    component: web
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canvas-frontend
  template:
    metadata:
      labels:
        app: canvas-frontend
        component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canvas-frontend
          image: canvas-frontend
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: BACKEND_HOST
              value: "canvas-backend:8080"
            - name: CMS_HOST
              value: "cms-backend:8080"
            - name: CORALOGIX_RUM_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: rum-keys
                  key: CORALOGIX_RUM_PUBLIC_KEY
            - name: CORALOGIX_RUM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: rum-keys
                  key: CORALOGIX_RUM_DOMAIN
            - name: CORALOGIX_APPLICATION
              value: "cms-demo"
            - name: CORALOGIX_SUBSYSTEM
              value: "canvas-frontend"
            - name: CORALOGIX_ORGANIZATION_NAME
              value: "Acme Digital Works"
            - name: CORALOGIX_ENVIRONMENT
              value: "set-per-overlay"
            - name: CORALOGIX_APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: build-info
                  key: APP_VERSION
            - name: CORALOGIX_RUM_SESSION_SAMPLE_RATE
              value: "100"
            - name: CORALOGIX_RUM_SESSION_RECORDING_ENABLED
              value: "false"
            - name: CORALOGIX_OTLP_TRACES_URL
              value: "/v1/traces"
            - name: RUM_DEMO_ENABLED
              value: "false"
            - name: RUM_DEMO_ALLOW_PROD
              value: "false"
            - name: RUM_DEMO_PANEL
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
