# Keys are relative: the ClusterSecretStores carry the cms-demo/<env>/ prefix (gitops-argocd.md).
# Wave -2 so the Jobs and pods that read these Secrets start after they exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-endpoints
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-parameters
  target:
    name: app-endpoints
    creationPolicy: Owner
  data:
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: kafka/bootstrap_brokers
    - secretKey: KAFKA_REPLICATION_FACTOR
      remoteRef:
        key: kafka/replication_factor
    - secretKey: PUBLIC_ORIGIN
      remoteRef:
        key: app/public_origin
    - secretKey: LLM_BASE_URL
      remoteRef:
        key: llm/base_url
    - secretKey: LLM_MODEL
      remoteRef:
        key: llm/model
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rum-keys
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: rum-keys
    creationPolicy: Owner
  data:
    - secretKey: CORALOGIX_RUM_PUBLIC_KEY
      remoteRef:
        key: coralogix-rum
        property: RUM_PUBLIC_KEY
    # Region of the RUM key's team (eu1.coralogix.com, ...).
    - secretKey: CORALOGIX_RUM_DOMAIN
      remoteRef:
        key: coralogix-rum
        property: DOMAIN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-api-key
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: app-secrets
  target:
    name: llm-api-key
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: llm
        property: API_KEY
