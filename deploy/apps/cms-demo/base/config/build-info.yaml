# APP_VERSION is rewritten by the same promotion commit that changes the image tags.
# DEPLOYMENT_ENVIRONMENT is set per overlay and equals the Argo CD notifications context (ADR-025).
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-info
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  APP_VERSION: unset
  DEPLOYMENT_ENVIRONMENT: unset
