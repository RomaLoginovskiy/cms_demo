apiVersion: v1
kind: Service
metadata:
  name: canvas-load-headless
  labels:
    app: canvas-load
spec:
  clusterIP: None
  selector:
    app: canvas-load
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
# ClusterIP only (was type LoadBalancer): admin UI via
#   kubectl -n cms-demo port-forward svc/canvas-load 8090:8090
apiVersion: v1
kind: Service
metadata:
  name: canvas-load
  labels:
    app: canvas-load
spec:
  type: ClusterIP
  selector:
    app: canvas-load
    statefulset.kubernetes.io/pod-name: canvas-load-0
  ports:
    - name: http
      port: 8090
      targetPort: 8090
    - name: metrics
      port: 9091
      targetPort: 9091
