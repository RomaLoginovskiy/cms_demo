apiVersion: apps/v1
kind: Deployment
metadata:
  name: canvas-frontend
spec:
  template:
    spec:
      containers:
        - name: canvas-frontend
          env:
            - name: CORALOGIX_ENVIRONMENT
              value: "load-test"
            - name: CANVAS_LAG_SIM_ENABLED
              value: "true"
            - name: CANVAS_LAG_SIM_MODE
              value: "large_board_render"
            - name: CANVAS_LAG_SIM_RENDER_COST_US
              value: "400"
            - name: CANVAS_LAG_SIM_LARGE_BOARD_THRESHOLD
              value: "1000"
            - name: CANVAS_LAG_SIM_ALLOW_PROD
              value: "false"
