apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Before the ApplicationSets (wave 0) that reference it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster add-ons (namespaces, secrets, edge, observability, AWS controllers)
  sourceRepos:
    - https://github.com/RomaLoginovskiy/cms_demo.git
    # floci only: local Git mirror (infra/local/docker-compose.yml, make local-sync)
    - http://172.30.0.11:3000/cms/cms_demo.git
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
    - https://stakater.github.io/stakater-charts
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns
    - https://kubernetes-sigs.github.io/metrics-server
    - docker.io/envoyproxy
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
