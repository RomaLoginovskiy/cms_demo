# Namespaces with Pod Security and Gateway route labels. Never pruned automatically.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: namespaces
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'namespaces-{{.metadata.labels.environment}}'
    spec:
      project: platform
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: deploy/platform/namespaces
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
