# AWS only: encrypted gp3 default StorageClass (floci keeps k3s local-path as default).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: storage
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            cloud: aws
  template:
    metadata:
      name: 'storage-{{.metadata.labels.environment}}'
    spec:
      project: platform
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: 'deploy/platform/storage/{{.metadata.labels.environment}}'
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
