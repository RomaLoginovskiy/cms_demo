# kube_pod_info / kube_node_info for Coralogix APM-to-infrastructure correlation; scraped by the
# Coralogix cluster collector (prometheus/ksm in platform/coralogix-otel).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-state-metrics
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'kube-state-metrics-{{.metadata.labels.environment}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-state-metrics
          targetRevision: 8.8.0
          helm:
            releaseName: kube-state-metrics
            valueFiles:
              - $values/deploy/platform/kube-state-metrics/values.yaml
        - repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
          targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
          ref: values
      destination:
        server: '{{.server}}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
