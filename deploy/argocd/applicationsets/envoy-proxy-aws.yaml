# AWS EnvoyProxy: NLB via AWS LBC (class set at creation), ACM TLS, allowlist, proxy protocol.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envoy-proxy-aws
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            cloud: aws
  template:
    metadata:
      name: 'envoy-proxy-{{.metadata.labels.environment}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: deploy/platform/envoy-gateway/proxy/aws
        kustomize:
          patches:
            - target: { kind: EnvoyProxy, name: cms-edge }
              patch: |-
                - op: replace
                  path: /spec/provider/kubernetes/envoyService/annotations/service.beta.kubernetes.io~1aws-load-balancer-ssl-cert
                  value: '{{index .metadata.annotations "acm_certificate_arn"}}'
                - op: replace
                  path: /spec/provider/kubernetes/envoyService/loadBalancerSourceRanges
                  value: {{ splitList "," (index .metadata.annotations "public_ingress_cidrs") | toJson }}
      destination:
        server: '{{.server}}'
        namespace: edge
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
