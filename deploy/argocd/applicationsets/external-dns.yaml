# AWS only, mandatory: owns the public record (alias to the NLB) derived from HTTPRoute hostnames.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            cloud: aws
  template:
    metadata:
      name: 'external-dns-{{.metadata.labels.environment}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://kubernetes-sigs.github.io/external-dns
          chart: external-dns
          targetRevision: 1.23.0
          helm:
            releaseName: external-dns
            valueFiles:
              - $values/deploy/platform/external-dns/values.yaml
            valuesObject:
              txtOwnerId: '{{index .metadata.annotations "aws_cluster_name"}}'
              domainFilters:
                - '{{index .metadata.annotations "route53_zone_name"}}'
              env:
                - name: AWS_DEFAULT_REGION
                  value: '{{index .metadata.annotations "aws_region"}}'
              serviceAccount:
                create: true
                name: external-dns
                annotations:
                  eks.amazonaws.com/role-arn: '{{index .metadata.annotations "irsa_role_arn_external_dns"}}'
        - repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
          targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
          ref: values
      destination:
        server: '{{.server}}'
        namespace: external-dns
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
