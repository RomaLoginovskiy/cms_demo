# AWS only. Cluster/VPC/region are passed explicitly: with IMDS hop limit 1 the controller cannot
# discover them. The chart renders its webhook certificate at template time, so its Secret data and
# the webhook caBundles are ignored (see also argocd-cm webhook ignoreDifferences).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            cloud: aws
  template:
    metadata:
      name: 'aws-load-balancer-controller-{{.metadata.labels.environment}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://aws.github.io/eks-charts
          chart: aws-load-balancer-controller
          targetRevision: 3.6.2
          helm:
            releaseName: aws-load-balancer-controller
            valueFiles:
              - $values/deploy/platform/aws-load-balancer-controller/values.yaml
            valuesObject:
              clusterName: '{{index .metadata.annotations "aws_cluster_name"}}'
              region: '{{index .metadata.annotations "aws_region"}}'
              vpcId: '{{index .metadata.annotations "aws_vpc_id"}}'
              serviceAccount:
                create: true
                name: aws-load-balancer-controller
                annotations:
                  eks.amazonaws.com/role-arn: '{{index .metadata.annotations "irsa_role_arn_aws_load_balancer_controller"}}'
        - repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
          targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
          ref: values
      destination:
        server: '{{.server}}'
        namespace: kube-system
      ignoreDifferences:
        - kind: Secret
          name: aws-load-balancer-tls
          namespace: kube-system
          jsonPointers:
            - /data
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
