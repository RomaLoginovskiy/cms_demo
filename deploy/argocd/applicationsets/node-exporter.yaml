# node_* host metrics for Coralogix APM-to-infrastructure correlation; scraped by the Coralogix
# cluster collector (prometheus/node-exporter in platform/coralogix-otel).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: node-exporter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'node-exporter-{{.metadata.labels.environment}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus-node-exporter
          targetRevision: 4.60.1
          helm:
            releaseName: node-exporter
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/deploy/platform/node-exporter/values.yaml
              - '$values/deploy/platform/node-exporter/values-{{.metadata.labels.environment}}.yaml'
        - repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
          targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
          ref: values
      destination:
        server: '{{.server}}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
