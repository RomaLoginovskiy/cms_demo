# ESO controller + ClusterSecretStores. Role ARNs and the per-environment key prefix come from the
# cluster Secret (GitOps Bridge); floci endpoint overrides come from values-floci.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: 'external-secrets-{{.metadata.labels.environment}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.14.0
          helm:
            releaseName: external-secrets
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/deploy/platform/external-secrets/values.yaml
              - '$values/deploy/platform/external-secrets/values-{{.metadata.labels.cloud}}.yaml'
        - repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
          targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
          ref: values
        - repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
          targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
          path: deploy/platform/external-secrets/stores
          kustomize:
            patches:
              - target: { kind: ServiceAccount, name: eso-app }
                patch: |-
                  - op: replace
                    path: /metadata/annotations/eks.amazonaws.com~1role-arn
                    value: '{{index .metadata.annotations "irsa_role_arn_eso_app"}}'
              - target: { kind: ServiceAccount, name: eso-observability }
                patch: |-
                  - op: replace
                    path: /metadata/annotations/eks.amazonaws.com~1role-arn
                    value: '{{index .metadata.annotations "irsa_role_arn_eso_observability"}}'
              - target: { kind: ServiceAccount, name: eso-argocd }
                patch: |-
                  - op: replace
                    path: /metadata/annotations/eks.amazonaws.com~1role-arn
                    value: '{{index .metadata.annotations "irsa_role_arn_eso_argocd"}}'
              - target: { kind: ClusterSecretStore, labelSelector: "cms-demo/store-service=SecretsManager" }
                patch: |-
                  - op: replace
                    path: /spec/provider/aws/prefix
                    value: 'cms-demo/{{.metadata.labels.environment}}/'
              - target: { kind: ClusterSecretStore, labelSelector: "cms-demo/store-service=ParameterStore" }
                patch: |-
                  - op: replace
                    path: /spec/provider/aws/prefix
                    value: '/cms-demo/{{.metadata.labels.environment}}/'
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
