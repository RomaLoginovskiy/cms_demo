# floci EnvoyProxy: plain LoadBalancer Service served by k3s ServiceLB.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envoy-proxy-floci
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            cloud: floci
  template:
    metadata:
      name: 'envoy-proxy-{{.metadata.labels.environment}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{index .metadata.annotations "gitops_repo_url"}}'
        targetRevision: '{{index .metadata.annotations "gitops_revision"}}'
        path: deploy/platform/envoy-gateway/proxy/floci
      destination:
        server: '{{.server}}'
        namespace: edge
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 5m }
